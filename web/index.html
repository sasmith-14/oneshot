<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ECEDEA" />
    <meta name="description" content="OneShot: the record of every action an agent asked for, and of what really happened on the wire." />
    <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
    <title>OneShot</title>
    <script>
      // Theme before first paint: "system" (the default) follows the OS; light or dark if chosen.
      const mode = localStorage.getItem("oneshot-theme");
      const dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      // Type preview: ?type=archivo|bricolage|fraunces|newsreader|instrument (Archivo is the default).
      const pick = new URLSearchParams(location.search).get("type");
      if (pick) localStorage.setItem("oneshot-type", pick);
      localStorage.removeItem("oneshot-palette");
      const type = localStorage.getItem("oneshot-type");
      if (type && type !== "archivo") document.documentElement.dataset.type = type;
    </script>
  </head>
  <body class="paper-grain">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
