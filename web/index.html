<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0B0D" />
    <meta name="description" content="OneShot: mission control for actions that must happen once. Watch them cross the wire, break things on purpose, and reconcile against the provider." />
    <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
    <title>OneShot</title>
    <script>
      // Theme before first paint: "system" (the default) follows the OS; light or dark if chosen.
      const mode = localStorage.getItem("oneshot-theme");
      const dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      ["oneshot-type", "oneshot-palette"].forEach((k) => localStorage.removeItem(k));
    </script>
  </head>
  <body class="grain">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
