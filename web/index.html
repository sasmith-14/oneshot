<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F8FA" />
    <meta name="description" content="OneShot lab console: watch an execution engine handle failure." />
    <title>OneShot Lab</title>
    <script>
      // Apply the saved/system theme before first paint (no flash).
      const t = localStorage.getItem("oneshot-theme");
      const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
