[project]
name = "oneshot"
version = "0.1.0"
description = "Educational reference implementation of reliable action execution for AI agents: durable tracking, safe retries, duplicate protection, crash recovery and reconciliation against a fake external provider."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
docs = [
    "markdown>=3.6",
    "pygments>=2.18",
    "playwright>=1.45",
]

[project.scripts]
oneshot = "oneshot.cli:main"
fakeprovider = "fakeprovider.__main__:main"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oneshot", "fakeprovider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: starts real subprocesses (fake provider, worker) and talks over real sockets",
]
